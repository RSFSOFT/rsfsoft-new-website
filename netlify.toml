# RSFSOFT — Netlify Configuration (Maximum Security Edition)
# 13 security layers active

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # All functions use native fetch() — requires Node.js 18+
  # Without this, Netlify may default to Node 16 → "fetch is not defined" errors
  NODE_VERSION = "18"

# ─── Apple Pay Domain Verification ───────────────────────────────────────────
# Apple requires this exact Content-Type for domain verification.
# The file at /.well-known/apple-developer-merchantid-domain-association must
# be served as application/octet-stream — not text/plain or anything else.
# Apple's verification bot crawls this URL when you click "Verify" in the
# Airwallex portal. Without this header rule, verification will FAIL.
[[headers]]
  for = "/.well-known/apple-developer-merchantid-domain-association"
  [headers.values]
    Content-Type = "application/octet-stream"
    # Allow Apple's verification crawlers (no CORS restriction on this endpoint)
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

# ─── Global Security Headers (all pages) ─────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"

    # Force HTTPS for 2 years
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Don't leak referrer to other sites
    Referrer-Policy = "no-referrer"

    # Disable unnecessary browser features
    # payment= allows Airwallex card iframe (checkout.airwallex.com) to use Payment Request API (Apple Pay, Google Pay on mobile)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self https://checkout.airwallex.com), usb=(), bluetooth=()"

    # XSS protection for legacy browsers
    X-XSS-Protection = "1; mode=block"

    # [S6] Content Security Policy — controls what can load on every page
    # Allows: our own scripts + Google Fonts + Font Awesome CDN + ipapi.co (IP lookup)
    # *.airwallex.com covers all subdomains used by Airwallex Elements on mobile
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://static.airwallex.com https://checkout.airwallex.com https://pci.airwallex.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.airwallex.com; connect-src 'self' https://ipapi.co https://api.ipify.org https://api.airwallex.com https://api-demo.airwallex.com https://checkout.airwallex.com https://pci.airwallex.com; frame-src 'self' https://checkout.airwallex.com https://static.airwallex.com https://pci.airwallex.com https://*.airwallex.com; frame-ancestors 'none';"

# ─── Payment Page: Maximum Security ──────────────────────────────────────────
[[headers]]
  for = "/payments.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "no-referrer"
    X-XSS-Protection = "1; mode=block"
    # No caching — always load fresh, never serve stale payment form
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"
    # CSP for payment page — Airwallex wildcard covers all element iframes on mobile
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self https://checkout.airwallex.com), usb=(), bluetooth=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://static.airwallex.com https://checkout.airwallex.com https://pci.airwallex.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.airwallex.com; connect-src 'self' https://ipapi.co https://api.ipify.org https://api.airwallex.com https://api-demo.airwallex.com https://checkout.airwallex.com https://pci.airwallex.com; frame-src 'self' https://checkout.airwallex.com https://static.airwallex.com https://pci.airwallex.com https://*.airwallex.com; frame-ancestors 'none'; form-action 'self';"

[[headers]]
  for = "/payments"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "no-referrer"
    X-XSS-Protection = "1; mode=block"
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self https://checkout.airwallex.com), usb=(), bluetooth=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://static.airwallex.com https://checkout.airwallex.com https://pci.airwallex.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://*.airwallex.com; connect-src 'self' https://ipapi.co https://api.ipify.org https://api.airwallex.com https://api-demo.airwallex.com https://checkout.airwallex.com https://pci.airwallex.com; frame-src 'self' https://checkout.airwallex.com https://static.airwallex.com https://pci.airwallex.com https://*.airwallex.com; frame-ancestors 'none'; form-action 'self';"

# ─── Netlify Functions: Strict headers ───────────────────────────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store, no-cache"
    X-Frame-Options = "DENY"

# ─── Apple Pay Domain Verification ───────────────────────────────────────────
# Apply the required octet-stream header to the exact verification path.
# We do not use redirects because Apple's validation fails if the file is redirected.
[[headers]]
  for = "/.well-known/apple-developer-merchantid-domain-association"
  [headers.values]
    Content-Type = "application/octet-stream"


# ─── Secure Evidence Folder — block direct web access ────────────────────────
[[headers]]
  for = "/secure_payment_evidence/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

[[redirects]]
  from   = "/secure_payment_evidence/*"
  to     = "/404.html"
  status = 404
  force  = true

# ─── Payment URL Rewrites & Redirects ─────────────────────────────────────────
[[redirects]]
  from   = "/payments"
  to     = "/payments.html"
  status = 200
  force  = true

[[redirects]]
  from   = "/pay-now-mockup.html"
  to     = "/payments"
  status = 301
  force  = true

# ─── Redirects: Force HTTPS ───────────────────────────────────────────────────
[[redirects]]
  from   = "http://rsfsoft.co.uk/*"
  to     = "https://www.rsfsoft.co.uk/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://www.rsfsoft.co.uk/*"
  to     = "https://www.rsfsoft.co.uk/:splat"
  status = 301
  force  = true
