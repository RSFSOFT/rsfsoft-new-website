# RSFSOFT — Netlify Configuration (Maximum Security Edition)
# 13 security layers active

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # All functions use native fetch() — requires Node.js 18+
  # Without this, Netlify may default to Node 16 → "fetch is not defined" errors
  NODE_VERSION = "18"

# ─── Apple Pay Domain Verification ───────────────────────────────────────────
# Apple requires this exact Content-Type for domain verification.
# The file at /.well-known/apple-developer-merchantid-domain-association must
# be served as application/octet-stream — not text/plain or anything else.
# Apple's verification bot crawls this URL when you click "Verify" in the
# Airwallex portal. Without this header rule, verification will FAIL.
[[headers]]
  for = "/.well-known/apple-developer-merchantid-domain-association"
  [headers.values]
    Content-Type = "application/octet-stream"
    # Allow Apple's verification crawlers (no CORS restriction on this endpoint)
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"

# ─── Global Security Headers (all pages) ─────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # Prevent MIME sniffing
    X-Content-Type-Options = "nosniff"

    # Force HTTPS for 2 years
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Send origin (not full URL) to cross-origin destinations — needed by Apple Pay, Google Pay, Airwallex
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable unnecessary browser features globally
    # payment=(self) allows Payment Request API for Airwallex Apple Pay / Google Pay
    # NOTE: Permissions-Policy spec requires unquoted origins
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), fullscreen=(self), payment=(self), usb=(), bluetooth=()"

    # XSS protection for legacy browsers
    X-XSS-Protection = "1; mode=block"

# ─── Payment Page: Maximum Security ──────────────────────────────────────────
[[headers]]
  for = "/payments.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), fullscreen=(self), payment=(self), usb=(), bluetooth=()"
    # ─── AIRWALLEX CSP — ALL domains extracted directly from SDK source ───────
    # SDK calls confirmed by inspecting https://static.airwallex.com/components/sdk/v1/index.js:
    #   • static.airwallex.com        — SDK scripts & assets
    #   • checkout.airwallex.com      — card element iframes & scripts
    #   • pci.airwallex.com           — PCI-DSS card processing iframe
    #   • o11y.airwallex.com          — ⚠ TELEMETRY (was missing — this was the CSP blocker!)
    #   • checkout-demo.airwallex.com — demo/sandbox checkout
    #   • static-demo.airwallex.com   — demo/sandbox static assets
    #   • checkout.sandbox.airwallex.com — sandbox environment
    #   • static.sandbox.airwallex.com   — sandbox static assets
    #   • api.airwallex.com           — live API
    #   • api-demo.airwallex.com      — demo API
    # All covered below across relevant directives.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.airwallex.com https://static-demo.airwallex.com https://static.sandbox.airwallex.com https://checkout.airwallex.com https://checkout-demo.airwallex.com https://checkout.sandbox.airwallex.com https://pci.airwallex.com https://pay.airwallex.com https://assets.airwallex.com https://merchant.airwallex.com https://api.airwallex.com https://api-demo.airwallex.com https://www.airwallex.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://static.airwallex.com https://static-demo.airwallex.com https://checkout.airwallex.com https://checkout-demo.airwallex.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://static.airwallex.com https://static-demo.airwallex.com; img-src 'self' data: blob: https://static.airwallex.com https://static-demo.airwallex.com https://checkout.airwallex.com https://checkout-demo.airwallex.com https://pci.airwallex.com https://pay.airwallex.com https://assets.airwallex.com https://www.airwallex.com; connect-src 'self' https://api.airwallex.com https://api-demo.airwallex.com https://checkout.airwallex.com https://checkout-demo.airwallex.com https://checkout.sandbox.airwallex.com https://pci.airwallex.com https://static.airwallex.com https://static-demo.airwallex.com https://static.sandbox.airwallex.com https://pay.airwallex.com https://assets.airwallex.com https://merchant.airwallex.com https://www.airwallex.com https://o11y.airwallex.com https://o11y-demo.airwallex.com https://ipapi.co https://api.ipify.org; frame-src 'self' https://checkout.airwallex.com https://checkout-demo.airwallex.com https://checkout.sandbox.airwallex.com https://pci.airwallex.com https://pay.airwallex.com https://static.airwallex.com https://static-demo.airwallex.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; form-action 'self';"

[[headers]]
  for = "/payments"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Cache-Control = "no-store, no-cache, must-revalidate, proxy-revalidate"
    Pragma = "no-cache"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), fullscreen=(self), payment=(self), usb=(), bluetooth=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.airwallex.com https://static-demo.airwallex.com https://static.sandbox.airwallex.com https://checkout.airwallex.com https://checkout-demo.airwallex.com https://checkout.sandbox.airwallex.com https://pci.airwallex.com https://pay.airwallex.com https://assets.airwallex.com https://merchant.airwallex.com https://api.airwallex.com https://api-demo.airwallex.com https://www.airwallex.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://static.airwallex.com https://static-demo.airwallex.com https://checkout.airwallex.com https://checkout-demo.airwallex.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://static.airwallex.com https://static-demo.airwallex.com; img-src 'self' data: blob: https://static.airwallex.com https://static-demo.airwallex.com https://checkout.airwallex.com https://checkout-demo.airwallex.com https://pci.airwallex.com https://pay.airwallex.com https://assets.airwallex.com https://www.airwallex.com; connect-src 'self' https://api.airwallex.com https://api-demo.airwallex.com https://checkout.airwallex.com https://checkout-demo.airwallex.com https://checkout.sandbox.airwallex.com https://pci.airwallex.com https://static.airwallex.com https://static-demo.airwallex.com https://static.sandbox.airwallex.com https://pay.airwallex.com https://assets.airwallex.com https://merchant.airwallex.com https://www.airwallex.com https://o11y.airwallex.com https://o11y-demo.airwallex.com https://ipapi.co https://api.ipify.org; frame-src 'self' https://checkout.airwallex.com https://checkout-demo.airwallex.com https://checkout.sandbox.airwallex.com https://pci.airwallex.com https://pay.airwallex.com https://static.airwallex.com https://static-demo.airwallex.com; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; form-action 'self';"

# ─── Netlify Functions: Strict headers ───────────────────────────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store, no-cache"
    X-Frame-Options = "DENY"

# ─── Apple Pay Domain Verification ───────────────────────────────────────────
# Apply the required octet-stream header to the exact verification path.
# We do not use redirects because Apple's validation fails if the file is redirected.
[[headers]]
  for = "/.well-known/apple-developer-merchantid-domain-association"
  [headers.values]
    Content-Type = "application/octet-stream"


# ─── Secure Evidence Folder — block direct web access ────────────────────────
[[headers]]
  for = "/secure_payment_evidence/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

# ─── AMP Pages: Allow AMP CDN & AMP Cache ────────────────────────────────────
# AMP requires cdn.ampproject.org for runtime scripts and the AMP Cache
# must be able to serve pages (no DENY frame-ancestors).
[[headers]]
  for = "/amp/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https://cdn.ampproject.org; script-src 'self' 'unsafe-inline' https://cdn.ampproject.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; connect-src 'self' https://cdn.ampproject.org https://formspree.io; font-src 'self' data: https:; frame-ancestors 'none'; form-action 'self' https://formspree.io;"
    X-Frame-Options = "SAMEORIGIN"
    Cache-Control = "public, max-age=900, stale-while-revalidate=3600"

[[redirects]]
  from   = "/secure_payment_evidence/*"
  to     = "/404.html"
  status = 404
  force  = true

# ─── AMP Pages: Serve directly (bypass .html-stripping redirects) ─────────────
[[redirects]]
  from   = "/amp"
  to     = "/amp/index.html"
  status = 200
  force  = false

[[redirects]]
  from   = "/amp/"
  to     = "/amp/index.html"
  status = 200
  force  = false

# ─── Payment URL Rewrites & Redirects ─────────────────────────────────────────
[[redirects]]
  from   = "/payments"
  to     = "/payments.html"
  status = 200
  force  = true

[[redirects]]
  from   = "/pay-now-mockup.html"
  to     = "/payments"
  status = 301
  force  = true

# ─── Redirects: Force HTTPS ───────────────────────────────────────────────────
[[redirects]]
  from   = "http://rsfsoft.co.uk/*"
  to     = "https://rsfsoft.co.uk/:splat"
  status = 301
  force  = true

[[redirects]]
  from   = "http://rsfsoft.co.uk/*"
  to     = "https://rsfsoft.co.uk/:splat"
  status = 301
  force  = true
